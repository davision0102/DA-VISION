# Hooks git : https://lefthook.dev/configuration/
pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: '*.{ts,tsx,js,json,css,md,yml}'
      run: npx prettier --write {staged_files}
      stage_fixed: true
    - name: lint
      glob: '*.{ts,tsx,js}'
      run: npx eslint {staged_files}
