<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Fabrik, un template React gratuit pensé pour les designers : une base prête, que ton assistant IA sait faire évoluer."
    />
    <title>Fabrik · template React open source</title>
    <meta
      name="theme-color"
      content="#fbf9f5"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#17140f"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Aperçu lors d'un partage (LinkedIn, X, Discord, Slack…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fabrik" />
    <meta property="og:title" content="Fabrik · template React open source" />
    <meta
      property="og:description"
      content="Un vrai site React, même sans être développeur. Composants, mode sombre et mise en ligne déjà réglés."
    />
    <meta property="og:url" content="https://davision0102.github.io/fabrik/" />
    <meta
      property="og:image"
      content="https://davision0102.github.io/fabrik/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Applique le thème avant le premier rendu pour éviter un flash.
      try {
        const saved = localStorage.getItem('theme')
        const dark = saved
          ? saved === 'dark'
          : matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
